<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840">
  <!-- Seamless tile: 840 = 30 grid cells of 28px, same grid as the website paper -->
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 0.5 H28 M0.5 0 V28" fill="none" stroke="#3FA9F5" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <!-- Brandenburger Tor, 180 x 136 -->
    <g id="tor">
      <path fill="none" d="M90 12 V4"/>
      <circle cx="90" cy="4" r="3"/>
      <path fill="none" d="M73 20 c1-7 5-10 9-9 l2 4 M82 20 c1-7 5-10 9-9 l2 4 M91 20 c1-7 5-10 9-9 l2 4 M100 20 c1-7 5-10 9-9 l2 4"/>
      <rect x="70" y="20" width="40" height="8"/>
      <path d="M40 44 V36 H58 V28 H122 V36 H140 V44 Z"/>
      <rect x="10" y="44" width="160" height="16"/>
      <path fill="none" d="M10 52 H170"/>
      <rect x="14" y="60" width="8" height="66"/>
      <rect x="40" y="60" width="8" height="66"/>
      <rect x="66" y="60" width="8" height="66"/>
      <rect x="106" y="60" width="8" height="66"/>
      <rect x="132" y="60" width="8" height="66"/>
      <rect x="158" y="60" width="8" height="66"/>
      <rect x="4" y="126" width="172" height="10"/>
    </g>

    <!-- Fernsehturm, 60 x 230 -->
    <g id="tv">
      <path fill="none" d="M30 40 V4 M27 16 h6 M27 28 h6"/>
      <rect x="26" y="40" width="8" height="14"/>
      <path d="M25 104 L35 104 L40 214 L20 214 Z"/>
      <path d="M6 228 L20 212 L40 212 L54 228 Z"/>
      <circle cx="30" cy="80" r="26"/>
      <path fill="none" d="M6 72 Q30 80 54 72 M5 86 Q30 94 55 86"/>
    </g>

    <!-- Reichstag, 190 x 110 -->
    <g id="rt">
      <path fill="none" d="M21 40 V22 M169 40 V22"/>
      <path d="M21 22 h13 v8 h-13 z M169 22 h13 v8 h-13 z"/>
      <path d="M64 52 C64 14 126 14 126 52 Z"/>
      <path fill="none" d="M95 24 V52 M80 28 C77 36 76 44 76 52 M110 28 C113 36 114 44 114 52 M68 40 Q95 32 122 40"/>
      <rect x="10" y="52" width="170" height="58"/>
      <rect x="4" y="40" width="34" height="70"/>
      <rect x="152" y="40" width="34" height="70"/>
      <path d="M62 64 L95 46 L128 64 Z"/>
      <path fill="none" d="M71 64 V104 M83 64 V104 M95 64 V104 M107 64 V104 M119 64 V104 M62 104 H128"/>
      <path fill="none" d="M46 72 h8 M46 90 h8 M136 72 h8 M136 90 h8 M12 52 h24 M154 52 h24"/>
    </g>

    <!-- Siegessaeule, 70 x 226 -->
    <g id="ss">
      <path d="M33 18 L20 6 L27 22 Z M37 18 L50 6 L43 22 Z"/>
      <path d="M35 13 L30 32 L40 32 Z"/>
      <circle cx="35" cy="9" r="4"/>
      <rect x="26" y="32" width="18" height="8"/>
      <rect x="29" y="40" width="12" height="118"/>
      <path fill="none" d="M29 72 h12 M29 102 h12 M29 132 h12"/>
      <rect x="17" y="158" width="36" height="24"/>
      <path fill="none" d="M24 162 v16 M31 162 v16 M39 162 v16 M46 162 v16"/>
      <rect x="8" y="182" width="54" height="34"/>
      <rect x="2" y="216" width="66" height="10"/>
    </g>

    <!-- Oberbaumbruecke with U-Bahn, 230 x 124 -->
    <g id="ob">
      <rect x="88" y="22" width="20" height="50"/>
      <rect x="122" y="22" width="20" height="50"/>
      <path d="M86 22 L98 6 L110 22 Z M120 22 L132 6 L144 22 Z"/>
      <path fill="none" d="M98 32 v12 M132 32 v12"/>
      <rect x="16" y="52" width="62" height="18" rx="5"/>
      <path fill="none" d="M24 59 h10 M40 59 h10 M56 59 h10"/>
      <rect x="0" y="70" width="230" height="12"/>
      <rect x="0" y="82" width="230" height="30"/>
      <path fill="none" d="M7 112 V100 Q19 86 31 100 V112 M39 112 V100 Q51 86 63 100 V112 M71 112 V100 Q83 86 95 100 V112 M103 112 V100 Q115 86 127 100 V112 M135 112 V100 Q147 86 159 100 V112 M167 112 V100 Q179 86 191 100 V112 M199 112 V100 Q211 86 223 100 V112"/>
      <path fill="none" d="M10 121 q8 -5 16 0 t16 0 t16 0 M150 121 q8 -5 16 0 t16 0 t16 0"/>
    </g>

    <!-- Little alien tourist (Hawaiian shirt + camera), 70 x 100 -->
    <g id="am">
      <path fill="none" d="M28 14 L22 6 M42 14 L48 6"/>
      <circle cx="22" cy="5" r="3"/>
      <circle cx="48" cy="5" r="3"/>
      <path fill="none" stroke-width="4" d="M25 48 L12 36 M45 50 L54 62 M29 74 L27 92 L21 94 M41 74 L43 92 L49 94"/>
      <circle cx="11" cy="34" r="3.5"/>
      <path d="M24 44 L46 44 L50 75 L20 75 Z"/>
      <path fill="none" stroke-width="4" d="M26 51 h0 M45 52 h0 M25 68 h0 M44 69 h0 M35 71 h0"/>
      <path fill="none" stroke-width="2" d="M27 45 L31 55 M43 45 L39 55"/>
      <rect x="29" y="54" width="12" height="9" rx="2"/>
      <circle cx="35" cy="58.5" r="2.5"/>
      <ellipse cx="35" cy="28" rx="18" ry="16"/>
      <ellipse cx="28" cy="27" rx="5" ry="6.5" fill="#2B7D37"/>
      <ellipse cx="42" cy="27" rx="5" ry="6.5" fill="#2B7D37"/>
      <path fill="none" d="M30 37 q5 4 10 0"/>
    </g>

    <!-- Currywurst, 130 x 66 -->
    <g id="cw">
      <path fill="none" d="M98 36 L120 8 M114 4 l4 8 M120 2 l3 8"/>
      <ellipse cx="26" cy="32" rx="10" ry="7"/>
      <ellipse cx="44" cy="30" rx="10" ry="7"/>
      <ellipse cx="62" cy="32" rx="10" ry="7"/>
      <ellipse cx="80" cy="30" rx="10" ry="7"/>
      <ellipse cx="96" cy="32" rx="10" ry="7"/>
      <path fill="none" d="M20 27 q6 -4 12 0 M56 27 q6 -4 12 0 M90 27 q6 -4 12 0"/>
      <path d="M8 36 L118 36 L106 64 L20 64 Z"/>
      <path fill="none" d="M30 44 L34 58 M96 44 L92 58"/>
    </g>

    <!-- small fillers -->
    <g id="ufo">
      <path d="M22 18 C22 4 48 4 48 18 Z"/>
      <ellipse cx="35" cy="22" rx="32" ry="9"/>
      <path fill="none" stroke-width="5" d="M18 22 h0 M35 25 h0 M52 22 h0"/>
    </g>
    <g id="die3">
      <rect x="1" y="1" width="28" height="28" rx="6"/>
      <path fill="none" stroke-width="5" d="M9 9 h0 M15 15 h0 M21 21 h0"/>
    </g>
    <g id="die6">
      <rect x="1" y="1" width="28" height="28" rx="6"/>
      <path fill="none" stroke-width="4.5" d="M9.5 8 h0 M9.5 15 h0 M9.5 22 h0 M20.5 8 h0 M20.5 15 h0 M20.5 22 h0"/>
    </g>
    <g id="poly">
      <path d="M2 2 H16 V30 H30 V44 H2 Z"/>
      <path fill="none" d="M2 16 H16 M2 30 H16 M16 30 V44"/>
    </g>
    <!-- Berliner (jam doughnut), side view, 72 x 48 -->
    <g id="bd">
      <path d="M32 4 C14 4 4 15 4 26 C4 38 16 46 32 46 C44 46 52 42 56 36 Q46 35 47 29 Q40 25 45 19 Q41 13 48 9 C43 5 38 4 32 4 Z"/>
      <path fill="#2B7D37" d="M54 36 Q45 35 46 29 Q39 25 44 19 Q40 13 47 9 Q30 22 40 35 Z"/>
      <path fill="#2B7D37" stroke="none" d="M47 37 C49 42 45 44 47 49 C48 52 52 51 51 47 C50 44 53 41 51 37 Z"/>
      <path fill="none" stroke-width="3.5" d="M14 15 h0 M23 10 h0 M32 9 h0 M18 23 h0 M28 18 h0 M11 27 h0 M23 30 h0"/>
      <path fill="none" d="M9 34 Q22 41 36 39"/>
    </g>
    <g id="tee">
      <path d="M2 2 H44 V16 H30 V30 H16 V16 H2 Z"/>
      <path fill="none" d="M16 2 V16 M30 2 V16 M16 16 H30"/>
    </g>
    <g id="st">
      <path fill="none" stroke-width="2.5" d="M8 0 V16 M0 8 H16"/>
    </g>
  </defs>

  <rect width="840" height="840" fill="#FBF7EE"/>
  <rect width="840" height="840" fill="url(#grid)"/>

  <g opacity="0.5" fill="#FBF7EE" stroke="#2B7D37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <use href="#tor"  transform="translate(40 50) rotate(-4 90 68)"/>
    <use href="#tv"   transform="translate(345 18) rotate(6 30 115)"/>
    <use href="#rt"   transform="translate(560 86) rotate(3 95 60)"/>
    <use href="#ss"   transform="translate(140 300) rotate(-5 35 113)"/>
    <use href="#am"   transform="translate(422 318) rotate(8 42 60) scale(1.2)"/>
    <use href="#cw"   transform="translate(620 390) rotate(-10 65 33)"/>
    <use href="#ob"   transform="translate(320 600) rotate(-3 115 62)"/>
    <use href="#ufo"  transform="translate(70 650) rotate(-12 35 20)"/>
    <use href="#die6" transform="translate(674 634) rotate(14 21 21) scale(1.4)" stroke-width="2.4"/>
    <use href="#die3" transform="translate(244 222) rotate(-18 21 21) scale(1.4)" stroke-width="2.4"/>
    <use href="#poly" transform="translate(770 250) rotate(10 16 23)"/>
    <use href="#tee"  transform="translate(36 778) rotate(-8 23 16)"/>
    <use href="#bd"   transform="translate(728 484) rotate(-8 47 31) scale(1.3)"/>
    <use href="#st" transform="translate(640 770) rotate(45 8 8)"/>
    <use href="#st" transform="translate(520 300)"/>
    <use href="#st" transform="translate(40 470) rotate(45 8 8)"/>
    <use href="#st" transform="translate(790 790)"/>
    <use href="#st" transform="translate(600 540) rotate(45 8 8)"/>
    <use href="#st" transform="translate(270 520)"/>
    <use href="#st" transform="translate(470 30) rotate(45 8 8)"/>
    <use href="#st" transform="translate(800 120)"/>
    <use href="#st" transform="translate(200 800) rotate(45 8 8)"/>
  </g>
</svg>
